intent:
  code_does: (before fix) _has_generic_or_protocol_as_origin does `frame.f_locals.get("origin")
    in {typing.Generic, Protocol, typing.Protocol}` — a set-literal membership test
    that hashes `origin`, raising TypeError when origin is/contains an Annotated alias
    with unhashable metadata (e.g. a set).
  check_expects: test_nested_annotated_with_unhashable_metadata (already present in
    src/test_typing_extensions.py, added together with the fix upstream) expects Annotated[List[Annotated[str,
    {...}]], "metadata"] to construct successfully and expose the right __origin__/__metadata__,
    i.e. no TypeError.
  spec_says: 'Issue report (PR #417 / issue #416, pydantic/pydantic#9503): nested
    Annotated with unhashable inner metadata must not raise TypeError; this was a
    regression introduced by the PEP 696 default-ordering check (_has_generic_or_protocol_as_origin)
    added for 4.12.0.'
  all_agree: false
  conflict_resolution: 'Code (current behavior) contradicts both the test and the
    spec/issue report. Per authority order (spec > test > code), the code is wrong
    and must be fixed to stop hashing `origin`. Applied the exact upstream fix: replace
    the set literal with a tuple literal in the `in` check, so membership is tested
    with `==` per element instead of hashing the left operand. After the fix, code/test/spec
    all agree.'
  answered: true
  skipped: false
