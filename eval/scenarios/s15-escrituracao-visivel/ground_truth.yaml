# como scope creep. Contava — inclusive até REFUTED acima de 2 arquivos — e
# passou dez rodadas sem ser visto, atravessando até o s07-honest-work (R11-3).
#
# `kata_visivel: true` desliga a exclusão e devolve o ambiente real.
