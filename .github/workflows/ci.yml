name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Push repetido num PR cancela o run anterior; em `main` não, porque o status
# de cada commit importa por si.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # A suíte roda em ~25s; dez minutos é margem larga e ainda corta um job
    # travado bem antes do limite padrão de seis horas.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado em pyproject.toml (requires-python);
        # 3.12 é a versão usada no desenvolvimento.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: make lint

      # O ruff check não reprova drift de formatação; sem este passo, o
      # format divergia do padrão declarado sem ninguém ver (R9-8/R10-6).
      - name: Format check
        run: make format-check

      # O gate de coverage (fail_under = 70) vem de pyproject.toml e é
      # aplicado pelo pytest-cov, então `make test` já reprova sozinho.
      # O guarda de drift de phases/ existe como teste (test_skills_build);
      # o alvo do Makefile verifica o gerado em si e ficava fora do CI (R10-32).
      - name: Skills em dia
        run: make check-skills

      - name: Test
        run: make test

      # Os traps provam que o JUDGE ainda caça as fraudes plantadas.
      # Sem isto, eval/ só roda quando alguém lembra de rodar à mão.
      - name: Adversarial eval traps
        run: python3 eval/run_traps.py

  # K-21: os instaladores PowerShell nunca foram executados — o CI só rodava
  # ubuntu e os .ps1 admitiam "não foi executado" no cabeçalho. Este job
  # espelha o que test_install.py faz para os .sh, em ambiente real: instala
  # (-Copy e default) e desinstala, tudo em dirs temporários via
  # OPENCODE_CONFIG_DIR/CLAUDE_CONFIG_DIR.
  installers-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instala skills do OpenCode (-Copy)
        shell: pwsh
        run: |
          $env:OPENCODE_CONFIG_DIR = "$env:RUNNER_TEMP/opencode-config"
          .\scripts\install.ps1 -Copy
          if (-not (Test-Path "$env:OPENCODE_CONFIG_DIR/agent/kata.md")) { throw "agente não instalado" }
          $skills = Get-ChildItem -Directory "$env:OPENCODE_CONFIG_DIR/skills"
          if ($skills.Count -lt 10) { throw "skills insuficientes: $($skills.Count)" }

      - name: Desinstala skills do OpenCode
        shell: pwsh
        run: |
          $env:OPENCODE_CONFIG_DIR = "$env:RUNNER_TEMP/opencode-config"
          .\scripts\install.ps1 -Uninstall
          if (Test-Path "$env:OPENCODE_CONFIG_DIR/agent/kata.md") { throw "agente não removido" }

      - name: Instala skills do Claude Code (-Copy)
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = "$env:RUNNER_TEMP/claude-config"
          .\scripts\install-claude-code.ps1 -Copy
          $skills = Get-ChildItem -Directory "$env:CLAUDE_CONFIG_DIR/skills"
          if ($skills.Count -lt 10) { throw "skills insuficientes: $($skills.Count)" }

      - name: Desinstala skills do Claude Code
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = "$env:RUNNER_TEMP/claude-config"
          .\scripts\install-claude-code.ps1 -Uninstall
          $skills = Get-ChildItem -Directory "$env:CLAUDE_CONFIG_DIR/skills" -ErrorAction SilentlyContinue
          if ($skills.Count -gt 0) { throw "skills não removidas: $($skills.Count)" }
