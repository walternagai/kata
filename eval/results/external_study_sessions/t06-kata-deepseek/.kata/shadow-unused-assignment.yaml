think:
  problem: "pyflakes não emite 'redefinition of unused X' quando uma definição de função/classe (def/class) sombreia uma atribuição de variável não usada (ex.: x = 1; def x(): pass). O teste test_redefined_function_shadows_variable espera m.RedefinedWhileUnused mas recebe lista vazia."
  assumptions:
    - "A causa é o método redefines: Binding.redefines só retorna True quando o outro binding é um Definition, e Assignment não é um Definition."
    - "A correção correta é fazer Definition.redefines também casar com Assignment, cobrindo def/class sombreando variável atribuída."
  alternatives:
    - "Modificar base Binding.redefines para incluir Assignment (rejeitado: afetaria Assignment/Argument redefinindo Assignment, ampliando demais o escopo)."
    - "Adicionar checagem específica em addBinding (rejeitado: mais invasivo que um override de redefines)."
  unknowns: "Se há casos de annotation ou named-expr que devam ser tratados; verificado que Annotation override redefines=False e não é afetado."
