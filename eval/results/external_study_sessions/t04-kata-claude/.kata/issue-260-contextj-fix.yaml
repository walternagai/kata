  check_expects: "tests/test_idna.py::IDNATests::test_check_label_contextj_violation asserts idna.check_label(latin + joiner + latin) raises idna.InvalidCodepointContext with 'not allowed at position 2' in the message, for both ZWNJ and ZWJ joiners without a valid virama context."
  spec_says: "check_label's own docstring states ':raises InvalidCodepointContext: If a CONTEXTJ or CONTEXTO codepoint is not valid in its context.' The sibling CONTEXTO branch (same function) already implements this correctly by raising InvalidCodepointContext unconditionally with no enclosing try. The issue report (user-provided, PR #261 description) explicitly requests narrowing the try to only the valid_contextj() call."
