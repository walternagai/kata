    - type: spec_betrayal
      severity: high
      description: >-
        intenção não alinhada: código, teste e spec discordam (flagged
        solely because intent.all_agree=false was honestly declared).
  caveats:
    - >-
      This is the expected, reviewed outcome of a real bug fix: the INTENT
      gate correctly recorded that the *pre-fix* code contradicted the
      Binding.used docstring spec (a bare `True` instead of `(scope,
      node)`), which is precisely the defect issue #764/PR #765 asks to
      fix. The judge's spec_betrayal check fires on any declared
      all_agree=false regardless of which direction the conflict was
      resolved, so it cannot distinguish "code was fixed to match spec"
      from "code was changed to dodge spec" automatically — it is a flag
      for human review, not an automatic finding of wrongdoing. Reviewed
      here: the fix makes code, test, and the documented `used` contract
      agree (see intent.conflict_resolution); no further action taken.
    - >-
      After correcting verify.ruff_clean / tests_pass / coverage_pass from
      an initial (inaccurate) `true` to the honest `false` — 3 pre-existing
      Python-3.12 test_api.py failures and 6 pre-existing flake8
      E231/E221 warnings, all confirmed identical on base_commit via `git
      stash`, unrelated to this fix — the judge's false_completion frauds
      disappeared entirely. Only the expected spec_betrayal flag remains.
