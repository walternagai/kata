think:
  problem: 'tomllib.loads(toml, parse_float=custom_fn) currently trusts custom_fn''s
    return value blindly. If custom_fn returns a dict or list (mutable/container
    types), the parser silently accepts it as if it were a scalar float, which can
    corrupt the resulting document structure (e.g. a "float" key silently becomes
    a dict/list) instead of failing loudly. test_invalid_parse_float expects a
    ValueError with message "parse_float must not return dicts or lists" to be
    raised as soon as such an illegal value is produced.'
  assumptions:
  - 'The fix must live in src/tomli/_parser.py (or a helper it uses), since that
    is where parse_float is invoked (via match_to_number in _re.py and directly
    for inf/nan literals).'
  - 'The validation must happen once per loads() call setup (wrapping parse_float),
    not by special-casing every call site, to keep the change surgical and avoid
    missing a call site.'
  - 'The default parse_float=float never returns dict/list, so the wrapper should
    special-case float to avoid adding overhead to the common path.'
  - 'The exact error message must match the test: "parse_float must not return
    dicts or lists".'
  alternatives:
  - 'Add an isinstance check after every call site of parse_float in _parser.py
    and _re.py (rejected: duplicates logic across 3 call sites, easy to miss one,
    violates SIMPLIFY).'
  - 'Wrap parse_float once at the top of loads() with a small validating closure
    and use the wrapped version everywhere downstream (chosen: single point of
    validation, matches upstream tomli/CPython tomllib fix for this exact PR).'
  unknowns: ''
  answered: true
  skipped: false
