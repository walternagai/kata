  reason: >-
    Single well-scoped behavioral bug in core Binding.redefines() logic
    (pyflakes/checker.py). Root cause already isolated via failing test
    (test_redefined_function_shadows_variable) and confirmed against the
    upstream pyflakes 3.4.0 fix. Not trivial: it changes shared logic used
    by every RedefinedWhileUnused check, so full-suite verification is
    required, not just a 2-line read-back.
  answered: true
  skipped: false
think:
  problem: >-
    `x = 1` followed by `def x(): pass` (or `class x: pass`) does not raise
    RedefinedWhileUnused, even though the assignment to `x` was never used
    before being shadowed by the function/class definition. Root cause:
    `Binding.redefines(self, other)` only returns True when `other` is a
    `Definition`; when a new `Definition` (function/class) redefines an
    existing plain `Assignment`, `value.redefines(existing)` uses the
    inherited `Binding.redefines` (Definition does not override it) and
    returns False, so `addBinding` never reports the warning.
  assumptions:
    - "Fix must not weaken any existing RedefinedWhileUnused warning (function-over-function, class-over-class, import-over-import, etc.) — only add the missing case."
    - "The correct fix is to override `redefines` on `Definition` to also return True when `other` is an `Assignment` with the same name, matching how upstream pyflakes (3.4.0, PyPI) resolved this exact issue."
    - "The 3 already-failing tests in test_api.py (test_invalidEscape, test_misencodedFileUTF16, test_nonDefaultFollowsDefaultSyntaxError) are pre-existing Python-3.12 column-number mismatches unrelated to this issue and are out of scope."
  alternatives:
    - "alt A: override `redefines` directly on `Binding` to check `isinstance(other, (Definition, Assignment))` — descartado: would also make a plain Assignment redefine another Assignment as RedefinedWhileUnused in cases not intended by the issue, over-broadening scope beyond def/class shadowing an assignment."
    - "alt B: special-case in `addBinding` (checker.py) with an explicit `isinstance(value, Definition) and isinstance(existing, Assignment)` check — descartado: duplicates logic that `redefines()` already encapsulates per-Binding-subclass; less consistent with the existing polymorphic design and diverges from the upstream fix."
    - "alt C (chosen): override `Definition.redefines` to call `super().redefines(other) or (isinstance(other, Assignment) and self.name == other.name)` — matches upstream pyflakes 3.4.0 exactly, minimal (4 lines), keeps all other subclasses (Importation, SubmoduleImportation, Annotation) untouched since they already override redefines independently."
  unknowns: |
    RESOLVED:
    1. Is there a canonical/upstream fix for this exact issue? -> Downloaded
       pyflakes 3.4.0 wheel from PyPI and inspected checker.py: Definition
       gained a `redefines` override exactly as described in alt C.
    2. Does this change affect Importation/SubmoduleImportation semantics?
       -> No: those classes already override `redefines` themselves and
       don't call `Definition.redefines` (Importation subclasses Definition
       but defines its own `redefines`, so the new Definition.redefines only
       affects FunctionDefinition/ClassDefinition/Builtin, i.e. plain def/class).
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  notes: >-
    Planned change is a single 4-line method override
    (Definition.redefines) reusing existing super().redefines() call plus
    one isinstance/name check against the already-existing Assignment
    class. No new class, no new parameter, no new config flag. Matches
    upstream pyflakes 3.4.0 verbatim.
  answered: true
  skipped: false
intent:
  code_does: >-
    Binding.redefines(self, other) returns True only when `other` is a
    Definition. Definition (and its subclasses FunctionDefinition,
    ClassDefinition) does not override redefines, so it inherits this
    behavior. Consequence: when a new FunctionDefinition/ClassDefinition
    is bound over an existing unused Assignment, value.redefines(existing)
    returns False (Assignment is not a Definition), so addBinding()
    (checker.py) never reports messages.RedefinedWhileUnused, even though
    the assignment was never used before being shadowed.
  check_expects: >-
    pyflakes/test/test_other.py::test_redefined_function_shadows_variable
    expects `x = 1` followed by `def x(): pass` to raise
    RedefinedWhileUnused (same expectation duplicated via doctest in
    test_doctests.py::TestOther). This mirrors existing passing tests for
    def-over-def, class-over-class, def-over-class and class-over-def
    (all Definition-over-Definition cases), which already pass today.
  spec_says: >-
    Issue title: "PR #761: produce an error when a definition shadows an
    unused assignment (resolves #760)". RedefinedWhileUnused's own
    docstring/message ('redefinition of unused %r from line %r') is
    generic and name-based, not tied to any specific Binding subclass
    combination, so it already covers this case semantically -- only the
    dispatch logic in Binding/Definition.redefines was incomplete.
  all_agree: false
  conflict_resolution: >-
    Code diverges from both the test and the issue/spec (code is missing
    a case, not implementing an alternate intended behavior). Authority
    order: user's issue description (highest, explicitly requests this
    exact diagnostic) and test agree with each other and disagree with
    current code. Resolution: fix the code to match test + spec by
    overriding Definition.redefines to also treat an unused Assignment
    as redefined, identical to the fix already shipped upstream in
    pyflakes 3.4.0.
  answered: true
  skipped: false
