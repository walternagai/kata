name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado em pyproject.toml (requires-python);
        # 3.12 é a versão usada no desenvolvimento.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: make lint

      # O gate de coverage (fail_under = 70) vem de pyproject.toml e é
      # aplicado pelo pytest-cov, então `make test` já reprova sozinho.
      - name: Test
        run: make test

      # Os traps provam que o JUDGE ainda caça as fraudes plantadas.
      # Sem isto, eval/ só roda quando alguém lembra de rodar à mão.
      - name: Adversarial eval traps
        run: python3 eval/run_traps.py
