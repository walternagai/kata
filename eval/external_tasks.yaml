  - id: t04
    repo: https://github.com/kjd/idna
    fix_commit: 9067b803a55441805934410b11c0899209b66785
    base_commit: 62f30346a210028aa37b9002c3e4814a2c06416a
    license: BSD-3-Clause
    test_cmd: 'python3 -m pytest tests/test_idna.py -q -p no:cacheprovider'
    test_files:
      - tests/test_idna.py
    issue: |
      PR #261: Issue 260 fix

      ### Summary

      In `idna/core.py`, `check_label` raises `InvalidCodepointContext` for a CONTEXTJ violation **inside a `try` block whose `except ValueError` clause catches it**, because `InvalidCodepointContext` → `IDNAError` → `UnicodeError` → `ValueError`. The exception is swallowed on the line below the one that raises it and re-raised as a different error with a different diagnosis. As a result, `InvalidCodepointContext` can never reach a caller for a CONTEXTJ violation.

      ```python
      if intranges_contain(cp_value, idnadata.codepoint_classes["CONTEXTJ"]):
          try:
              if not valid_contextj(label, pos):
                  raise InvalidCodepointContext(f"Joiner {_unot(cp_value)} not allowed at position {pos + 1} in {label!r}")
          except ValueError as err:
              raise IDNAError(
                  f"Unknown codepoint adjacent to joiner {_unot(cp_value)} at position {pos + 1} in {label!r}"
              ) from err
      ```

      The `except` clause is there for a good reason — `valid_contextj` calls `_combining_class`, which can raise `ValueError("Unknown character in unicodedata")`, and converting that into an `IDNAError` is reasonable. The defect is that the clause *also* catches the `InvalidCodepointContext` raised on the line above it, which it was presumably never meant to see.

      ### Observed behaviour

      ```python
      >>> import idna
      >>> idna.encode('a‌b')   # ZERO WIDTH NON-JOINER, CONTEXTJ violation
      idna.IDNAError: Unknown codepoint adjacent to joiner U+200C at position 2 in 'a‌b'
      >>> idna.encode('a·l')   # MIDDLE DOT, CONTEXTO violation
      idna.InvalidCodepointContext: Codepoint U+00B7 not allowed at position 2 in 'a·l'
      ```

      The first reports the diagnosis meant for an *unknown character adjacent to a joiner*, which is not what happened. The second — the sibling CONTEXTO branch, whose `raise` sits outside any `try` — reports correctly. The asymmetry between the two sibling branches is what makes this look like a defect rather than a design choice.

      The package's own UTS46 test suite cannot catch this: the generated cases assert the base type `IDNAError`, which the wrong path also satisfies.

      ### Suggested fix

      Move the CONTEXTJ `raise` out of the `try`, so the handler sees only exceptions from `valid_contextj`:

      ```python
      try:
          ok = valid_contextj(label, pos)
      except ValueError as err:
          raise IDNAError(
              f"Unknown codepoint adjacent to joiner {_unot(cp_value)} at position {pos + 1} in {label!r}"
          ) from err
      if not ok:
          raise InvalidCodepointContext(f"Joiner {_unot(cp_value)} not allowed at position {pos + 1} in {label!r}")
      ```

      ### Verification

      I ran the patch against the 12,666 UTS46 conformance cases generated in `tests/test_idna_uts46.py` (idna 3.18, and the block is unchanged on current `master`):

      - accept/reject verdict changed: **0** of 12,666
      - exception type corrected: **1,258** cases now raise `InvalidCodepointContext` instead of `IDNAError` with the joiner-adjacency message; none changed to anything else

      So the fix is behaviour-preserving for anyone catching `IDNAError` or checking only success/failure (both `InvalidCodepointContext` and the current behaviour are `IDNAError` subclasses), and it corrects the reported type and message for CONTEXTJ violations. Callers matching on the *message* of the current (mis-)diagnosis would see the new message.

      The verification script is part of a test-suite-coverage study where this surfaced as a masking anomaly; happy to open a PR with the patch above if that's welcome.
