  no_single_use_abstractions: true
  no_speculative_config: true
  notes: 'git diff --stat: 1 file changed (src/tomli/_parser.py), 24 insertions,
    0 deletions. Single helper function (make_safe_parse_float) plus one call-site
    line in loads(). This mirrors the canonical upstream tomli/CPython tomllib fix
    for this exact PR, applied at a single choke point (loads()) so every downstream
    call to parse_float (match_to_number, and the direct inf/nan calls) is covered
    without duplicating the isinstance check at 3 call sites. The float-fast-path
    check (if parse_float is float: return float) avoids adding overhead to the
    default/common case, matching an existing pattern already used elsewhere in
    this codebase. No new parameters, no configurability, no unused abstraction —
    the wrapper is created and used exactly once, is not exported, and has exactly
    the responsibility the bug requires.'
  answered: true
  skipped: false
intent:
  code_does: 'src/tomli/_parser.py invokes the user-supplied parse_float callback
    (via _re.match_to_number, and directly for inf/nan literal parsing) and uses
    whatever it returns without any type validation. A parse_float that returns a
    dict or list is silently accepted as a scalar value.'
  check_expects: 'tests/test_error.py::test_invalid_parse_float expects
    tomllib.loads("f=0.1", parse_float=dict_returner_or_list_returner) to raise
    ValueError with message exactly "parse_float must not return dicts or lists".'
  spec_says: 'No README/CHANGELOG entry exists yet for this behavior (unreleased
    fix). The issue title itself ("PR #180: Eagerly raise an error if parse_float
    produces illegal types") is the spec, and it agrees with the test: validation
    must happen eagerly (at parse time), not lazily when the value is later used.'
  all_agree: true
  conflict_resolution: 'No conflict: code is simply missing the behavior that both
    the test and the issue/spec require. Code will be updated to match test +
    spec; test is not being altered.'
  answered: true
  skipped: false
