think:
  problem: "more.py:last() usa hasattr(iterable, '__reversed__') para decidir se chama reversed(iterable). Quando um objeto declara __reversed__ = None (atributo presente mas nao chamavel) hasattr retorna True, last() tenta reversed(iterable), que levanta TypeError (nao capturado -> deveria ser, mas o efeito real e que StopIteration/TypeError sao capturados e o fallback deque nunca roda), resultando em ValueError espurio 'empty iterable' mesmo quando o iteravel tem itens via __iter__."
  assumptions:
    - "getattr(iterable, '__reversed__', None) e suficiente para distinguir 'nao declarado' de 'declarado como None'; nao precisamos checar callable() pois o PR original considera isso desnecessario para o uso esperado"
    - "Objetos que definem __reversed__ = None ainda implementam __iter__ corretamente, entao o fallback deque(iterable, maxlen=1) funciona"
    - "TypeError ja e capturado no except da funcao last(), entao quando getattr(...) is None cairmos no ramo deque, nenhum novo except e necessario"
  alternatives:
    - "alt A: manter hasattr mas envolver reversed() em try/except TypeError e continuar para deque - descartado: mais codigo, mesmo resultado, diverge do fix oficial do PR #1028"
    - "alt B: checar callable(getattr(iterable, '__reversed__', None)) - descartado (por ora): o proprio PR diz que e desnecessario para uso esperado; manter minimo"
    - "alt C (escolhida): trocar hasattr por getattr(iterable, '__reversed__', None) is not None, replicando exatamente o fix do PR #1028"
  unknowns: |
    RESOLVIDO: confirmado via pytest que o teste tests/test_more.py::LastTests::test_reversed_is_none falha hoje com ValueError em vez de retornar 1 (grep + read do arquivo fonte e teste).
    RESOLVIDO: verificado que Sequence check vem antes (isinstance(iterable, Sequence)) entao objetos tipo lista continuam usando iterable[-1] sem passar por este ramo.
  answered: true
  skipped: false
