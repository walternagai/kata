twins:
  searched: true
  pattern: 'maxsplit == 1'
  result: >-
    4 occurrences across more_itertools/more.py: split_at (line 1321),
    split_before (line 1356), split_after (line 1393, the one fixed here),
    split_when (line 1437). Inspected each:
    - split_at: 'yield list(it); return' can legitimately yield a trailing
      [] when pred matches the last item, but this is DOCUMENTED, intended
      behavior (its own docstring example
      'list(split_at(range(10), lambda n: n % 2 == 1))' shows a trailing []
      even without maxsplit) — not a twin defect.
    - split_before: 'yield [item] + list(it); return' always includes
      `item` itself, so the yielded list can never be empty — no twin
      defect.
    - split_when: 'yield [next_item] + list(it); return' — same reasoning
      as split_before, always non-empty — no twin defect.
    Manually verified split_before/split_when with maxsplit=1 and a
    predicate matching the last pair: both return correctly-shaped,
    non-spurious results (no extra empty list).
