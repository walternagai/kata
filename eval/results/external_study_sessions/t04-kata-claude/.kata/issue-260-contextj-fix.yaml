think:
  problem: "In idna/core.py check_label(), the CONTEXTJ branch wraps both the valid_contextj(...) call AND the subsequent 'raise InvalidCodepointContext(...)' inside the same try block whose except ValueError clause is meant only to catch failures from _combining_class() inside valid_contextj(). Because InvalidCodepointContext subclasses IDNAError -> UnicodeError -> ValueError, the except clause also swallows the InvalidCodepointContext raised on the line right below it and replaces it with a generic IDNAError carrying a misleading 'joiner adjacency unknown codepoint' message. Callers can never observe InvalidCodepointContext for an actual CONTEXTJ violation, and the diagnostic message is wrong."
  assumptions:
    - "The except ValueError clause exists specifically to convert a ValueError raised inside valid_contextj() (from _combining_class on an unrecognized codepoint) into an IDNAError with a joiner-adjacency message; it was never intended to catch the InvalidCodepointContext raised by check_label itself."
    - "Moving the InvalidCodepointContext raise outside the try block preserves the accept/reject verdict for all inputs (issue author verified 0/12666 UTS46 conformance cases changed verdict) and only corrects the exception type/message for CONTEXTJ violations (1258 cases)."
    - "No other code in the repo or tests relies on the current (buggy) IDNAError-with-joiner-message behavior for a real CONTEXTJ violation; tests/test_idna.py::test_check_label_contextj_violation already asserts the corrected behavior (InvalidCodepointContext) and is the one currently failing."
  alternatives:
    - "alt A: catch InvalidCodepointContext explicitly first and re-raise it before the generic except ValueError — descartado: more code than needed, less readable than simply narrowing the try block to only the call that can raise ValueError."
    - "alt B: move only the raise out of the try (issue's suggested fix: try/except around valid_contextj() call only, then raise outside) — escolhido: minimal diff, directly narrows the try to the only statement that can legitimately raise ValueError (valid_contextj), matches the sibling CONTEXTO branch's structure (raise outside try)."
  unknowns: |
    RESOLVIDO:
    1. Is there an existing test that already encodes the correct expected behavior? -> yes, tests/test_idna.py::IDNATests::test_check_label_contextj_violation (added for this issue) currently fails with the bug present, expects idna.InvalidCodepointContext.
    2. Does valid_contextj() actually call something that can raise ValueError? -> yes, checked idna/core.py: valid_contextj calls _combining_class() which raises ValueError("Unknown character in unicodedata") for un-recognized codepoints (per docstring and test_check_label_contextj_unknown_codepoint).
     3. Does the CONTEXTO sibling branch already raise outside its try (i.e. does it not even use try)? -> confirmed by reading idna/core.py: the CONTEXTO branch has no try/except at all; raise is unconditional at top level, consistent with moving CONTEXTJ's raise outside its narrowed try.
  answered: true
  skipped: false
