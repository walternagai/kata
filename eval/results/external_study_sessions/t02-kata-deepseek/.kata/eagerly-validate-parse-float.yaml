think:
  problem: "PR #180: parse_float that returns a dict or list must be rejected eagerly. Currently match_to_number returns parse_float(...) result unchecked, so an illegal dict/list silently corrupts the parsed output. Fix: wrap parse_float to raise ValueError on dict/list return."
  assumptions:
    - "Only dict and list are illegal (upstream PR #180 contract, matching the test's expected error message)."
    - "The default float callable never returns illegal types, so it can be short-circuited for performance."
  alternatives:
    - "Validate inside match_to_number at call site (rejected: would duplicate the check at many call sites; wrapping once at the loads/load entry point is minimal)."
    - "Reject at output assembly (rejected: not eager; the error must fire at parse_float call time)."
  unknowns: "None significant; the expected message is pinned by tests/test_error.py."
  answered: true
  skipped: true
