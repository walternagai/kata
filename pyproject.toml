[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kata"
version = "0.1.0"
description = "Kata (型) — Karpathy Development Cycle: CLI + OpenCode agent + Claude Code skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Walter Nagai" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
kata = "kata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Os fixtures de eval são projetos deliberadamente defeituosos — o s03 planta
# um F401 justamente para o judge reprovar a re-execução do ruff. São dados de
# teste, não código do projeto. `eval/run_traps.py`, que é código de verdade,
# continua lintado.
extend-exclude = ["eval/scenarios/*/fixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "unit: testes unitários rápidos sem dependências externas",
]

[tool.coverage.run]
source = ["kata"]
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
