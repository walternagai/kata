fit:
  trivial: true
  route: code-loop
  reason: '1-line fix in a single function (_has_generic_or_protocol_as_origin): change
    a set literal to a tuple literal in an `in` membership check so it no longer hashes
    its left operand. No new files, no API surface change.'
  answered: true
  skipped: false
think:
  problem: 'Annotated[List[Annotated[str, {"unhashable_metadata"}]], "metadata"] raises
    TypeError: unhashable type: ''set''. The traceback shows _collect_parameters ->
    _has_generic_or_protocol_as_origin -> `frame.f_locals.get("origin") in {typing.Generic,
    Protocol, typing.Protocol}`. Membership test against a set literal requires hashing
    the left operand (`origin`, here the nested Annotated generic alias), and hashing
    recurses into its unhashable metadata (a set).'
  assumptions:
  - 'Confirmed upstream fix (python/typing_extensions PR #417, commit be9396b) replaces
    the set literal `{...}` with a tuple literal `(...)` in that same `in` check,
    since tuple membership uses `==` per element instead of hashing.'
  - No other call site relies on this being a set (it's only used once, immediately
    in a boolean `in` test).
  alternatives:
  - 'Wrap the `in` check in try/except TypeError -> rejected: silently swallows real
    bugs and is what upstream deliberately avoided.'
  - Use identity comparison (`origin is typing.Generic or origin is Protocol or origin
    is typing.Protocol`) -> equivalent behavior to the tuple fix, but diverges from
    the merged upstream patch without benefit.
  unknowns: 'None outstanding; verified against the actual upstream diff for PR #417
    via GitHub before editing.'
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  notes: 'Diff is a 2-line change (set literal -> tuple literal) inside an existing
    function; no new abstractions, no new parameters, no speculative config. Matches
    the merged upstream patch exactly (python/typing_extensions PR #417, commit be9396b).'
  answered: true
