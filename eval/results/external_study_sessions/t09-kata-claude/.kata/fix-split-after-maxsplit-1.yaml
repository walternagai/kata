  answered: true
  skipped: false
think:
  problem: >-
    split_after(iterable, pred, maxsplit=1) yields a spurious empty trailing
    list ([]) when the predicate matches on the last item of the iterable.
    E.g. split_after([1], lambda x: x == 1, 1) currently returns [[1], []]
    instead of [[1]]. This mirrors upstream more-itertools issue #658.
  assumptions:
    - "The maxsplit==1 special-case branch in split_after (more.py) is the
      only place with this defect; the general (maxsplit>1 or -1) loop
      already skips the trailing yield correctly via 'if buf:' at the end."
    - "The existing test tests/test_more.py::SplitAfterTest::test_max_split
      already contains the regression case '([1], lambda x: x == 1, 1) ->
      [[1]]' added for this exact issue, and is the source of truth for
      expected behavior (confirmed by fetching upstream PR #659 diff)."
    - "No other function in the codebase (split_before, split_when, etc.)
      shares this exact code path, since split_after has its own maxsplit==1
      shortcut not present in the others."
  alternatives:
    - "Guard with 'if list(it): yield ...' inline — rejected, evaluates the
      remainder into a list twice conceptually and is less readable than
      assigning to buf first."
    - "Change the trailing 'if buf: yield buf' logic to be reused via a
      shared helper — rejected as over-engineering for a 2-line fix
      (violates SIMPLIFY minimum-code principle)."
    - "Chosen fix (matches upstream PR #659): in the maxsplit==1 branch,
      assign 'buf = list(it)' and only 'yield buf' if buf is non-empty,
      before returning."
  unknowns: ''
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  notes: >-
    Fix is a 2-line change inside the existing maxsplit==1 branch: assign
    'buf = list(it)' and guard the yield with 'if buf:'. No new function,
    parameter, or config added; mirrors the exact same 'if buf: yield buf'
    idiom already used at the end of the function for the no-maxsplit case,
    so it's the smallest change consistent with the existing style.
  answered: true
  skipped: false
intent:
  code_does: >-
    In split_after (more_itertools/more.py), when maxsplit==1 and pred
    matches an item, the code does 'yield buf' then unconditionally
    'yield list(it); return' — so if the matching item was the last one in
    the iterable, an extra empty list [] is yielded after the real result.
  check_expects: >-
    tests/test_more.py::SplitAfterTest::test_max_split includes the case
    (([1], lambda x: x == 1, 1), [[1]]) — i.e. no trailing empty list when
    the predicate matches on the final item with maxsplit=1.
  spec_says: >-
    The split_after docstring states results are "lists of items ... where
    each list ends with an item where pred returns True" and shows no
    trailing empty groups in any example; the same function's own
    no-maxsplit tail ('if buf: yield buf') already encodes the convention
    that an empty remainder is never yielded as its own group.
  all_agree: false
  conflict_resolution: >-
    Code disagrees with both the test and the docstring/existing-convention
    (spec). Per authority order (spec > test > code), the code is fixed to
    stop yielding the spurious empty trailing list, matching upstream
    more-itertools PR #659 exactly.
  answered: true
  skipped: false
