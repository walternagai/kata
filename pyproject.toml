[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kata-dev"
version = "0.7.5"
description = "Kata (型) — Karpathy Development Cycle: CLI + OpenCode agent + Claude Code skills"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: SPDX como string + arquivos de licença, no lugar da tabela
# `{ text = "MIT" }`, que o setuptools deprecia com prazo em 2027-02-18
# (revisão completa 2026-10, B4). `setuptools>=77` é o piso que entende a
# forma nova; sem ele o build isolado do pip pega a versão certa sozinho.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["kata", "karpathy", "code-review", "quality-gate", "ai-agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
# Sem "License :: OSI Approved :: MIT License": com a expressão SPDX acima, o
# classificador de licença é redundante e o próprio PEP 639 pede para não usá-lo.
authors = [{ name = "Walter Nagai" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/walternagai/kata"
Repository = "https://github.com/walternagai/kata"
Issues = "https://github.com/walternagai/kata/issues"
Documentation = "https://github.com/walternagai/kata/blob/main/DOCUMENTATION.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
kata = "kata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kata = ["assets/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Os fixtures de eval são projetos deliberadamente defeituosos — o s03 planta
# um F401 justamente para o judge reprovar a re-execução do ruff. São dados de
# teste, não código do projeto. `eval/run_traps.py`, que é código de verdade,
# continua lintado.
extend-exclude = ["eval/scenarios/*/fixture", "eval/scenarios/*/baseline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "unit: testes unitários rápidos sem dependências externas",
]

[tool.coverage.run]
# `include`, e não `source`: `source` só aceita diretório ou nome de módulo —
# um arquivo ali é tratado como módulo, falha ao "importar" e é descartado com
# um warning que ninguém lê. Era o que acontecia desde o CR-006/S4: os dois
# scripts eram declarados e sumiam do relatório, deixando 482 statements fora
# do denominador (revisão completa de 2026-10, achado A1). Com `include` os
# arquivos entram por caminho e o gate mede o que promete medir.
include = [
    "src/kata/*",
    "scripts/build_skills.py",
    "scripts/check_package.py",
    "eval/run_traps.py",
]
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
