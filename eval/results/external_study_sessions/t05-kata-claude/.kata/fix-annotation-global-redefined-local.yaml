fit:
  trivial: true
  route: code-loop
  reason: >-
    Single-line, one-file fix in pyflakes/checker.py::handleNodeLoad; the
    failing test and TypeError traceback already pinpoint the exact
    statement to change.
  answered: true
  skipped: false
think:
  problem: >-
    pyflakes/checker.py:handleNodeLoad sets `scope[name].used = True` when
    an Annotation binding is loaded from an outer scope, instead of the
    `(self.scope, node)` tuple every other code path uses for `.used`.
    handleNodeStore later does `used = name in scope and scope[name].used`
    then `used[0] is self.scope`, which assumes `.used` is either False or
    a 2-tuple. When it is the bare bool True, subscripting it raises
    `TypeError: 'bool' object is not subscriptable`, crashing the checker
    on code like `x: int; x.__dict__; def f(): x = 1`.
  assumptions:
    - "`.used` is meant to be `False` (never used) or a `(scope, node)`
      tuple everywhere in the checker (confirmed by grep of all other
      `.used = ...` assignments)."
    - "The intended behavior for annotation-only bindings is identical to
      any other binding load: record `(self.scope, node)` so later scope
      analysis (e.g. handleNodeStore's redefinition check) works
      correctly."
    - "No other code depends on `.used` being literally `True` for
      Annotation bindings (grep shows no `is True` or truthiness-only
      check on `.used` elsewhere)."
  alternatives:
    - "Guard handleNodeStore's `used[0]` access with an isinstance/tuple
      check instead of fixing the assignment — rejected: it treats the
      symptom, leaves `.used` inconsistent with the rest of the codebase,
      and could mask the same bug in future call sites."
    - "Make Annotation.used a property that normalizes bool to a tuple —
      rejected: unnecessary abstraction (SIMPLIFY) for a one-line fix; no
      other Binding subclass needs this."
  unknowns: ''
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  notes: >-
    Fix is a single-token change (`True` -> `(self.scope, node)`) on the
    existing line; no new abstraction, no config, matches the pattern used
    by every other `.used = ...` assignment in the same file.
  answered: true
  skipped: false
intent:
  code_does: >-
    handleNodeLoad sets `scope[name].used = True` (a bare bool) for
    Annotation bindings loaded from an outer scope.
  check_expects: >-
    test_unused_annotation_in_outer_scope_reassigned_in_local_scope expects
    `x: int` (module-level annotation) to be flagged UndefinedName when
    accessed, and the later local `x = 1` inside `f` to be flagged
    UnusedVariable, without the checker crashing.
  spec_says: >-
    Binding.__init__ docstring: "@ivar used: pair of (L{Scope}, node)
    indicating the scope and the node that this binding was last used."
    Every other assignment to `.used` in checker.py sets a `(scope, node)`
    tuple or False; this is the only outlier.
  all_agree: false
  conflict_resolution: >-
    Code contradicts both the spec (docstring) and the test/runtime
    expectation (handleNodeStore unconditionally subscripts `.used`).
    Resolved per spec: `.used` must always be `(scope, node)` or `False`,
    so the Annotation branch is changed to `scope[name].used = (self.scope,
    node)`, matching every other call site.
  answered: true
  skipped: false
surgical:
  files:
    - path: pyflakes/checker.py
      necessary: true
      reason: >-
        One-line fix inside handleNodeLoad: `scope[name].used = True` ->
        `scope[name].used = (self.scope, node)`.
  removed_imports_clean: true
  answered: true
  skipped: false
